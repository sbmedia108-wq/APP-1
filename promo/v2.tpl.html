<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>swot. — Meet Mitch (promo)</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="engine.css">
<style>
.vdots{background-color:var(--paper);background-image:radial-gradient(#E0DCD1 1.3px,transparent 1.3px);background-size:22px 22px}
.vrays{position:absolute;left:-400px;top:-300px;width:1340px;height:1340px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(21,21,28,.055) 0 9deg,transparent 9deg 18deg)}
.vmood{box-sizing:border-box;background:#fff;border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);height:292px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 10px 18px;text-align:center}
.vmood svg{width:220px;height:174px}
.vmood b{font:800 30px/1 'Bricolage Grotesque';letter-spacing:-.03em;color:var(--ink)}
.vmood small{font:600 14px/1.25 Inter;color:#6E6D78;margin-top:6px;display:block}
</style>
</head><body>
<div id="stage">

<!-- 0–2 INTRO -->
<div class="vscene" data-show="0-2" style="background:var(--ink)">
  <div style="position:absolute;inset:0;animation:vfadeout .28s ease-in 1.72s forwards">
    <div class="vabs vcenter vd" style="top:300px;font-weight:800;font-size:70px;color:var(--lime);animation:vpop .4s var(--back) .25s both">psst.</div>
    <div class="vabs vcenter vd" style="top:420px;font-weight:800;font-size:62px;line-height:1;color:#fff;animation:vrise .4s var(--back) .9s both">someone wants<br>to meet you.</div>
    <div class="vabs" style="left:210px;top:650px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(200,242,58,.55),transparent 65%);animation:vpop .5s var(--back) 1.1s both, vpulse .5s ease-out 1.25s infinite"></div>
  </div>
</div>

<!-- 2–6 HERO -->
<div class="vscene" data-show="2-6" style="background:var(--lime)">
  <div class="vrays" style="animation:vspin 20s linear 2s infinite"></div>
  <div class="vabs" style="left:60px;top:150px;width:420px;animation:vdropin .75s ease-out 2s both"><div id="heroMitch" style="animation:vfloat 1s ease-in-out 2.8s infinite"></div></div>
  <div class="vabs vcenter vd" style="top:500px;font-weight:800;font-size:170px;line-height:1;color:var(--ink);animation:vslam .36s var(--out) 2.5s both">Mitch<span style="color:#fff">.</span></div>
  <div class="vabs vcenter vd" style="top:700px;font-weight:800;font-size:34px;color:var(--ink);animation:vrise .45s var(--back) 3.5s both">Powerhouse of the cell.</div>
  <div class="vabs vcenter" style="top:760px;animation:vpop .45s var(--back) 4.5s both"><span class="vd" style="display:inline-block;background:var(--ink);color:var(--lime);font-weight:800;font-size:30px;padding:12px 20px;border-radius:18px;transform:rotate(-2deg)">Powered by your revision.</span></div>
</div>

<!-- 6–16 VARIANTS (built in JS) -->
<div id="variants"></div>

<!-- 16–20 MOODS -->
<div class="vscene vdots" data-show="16-20">
  <div class="vabs vcenter" style="top:70px;animation:vrise .4s var(--back) 16s both"><span class="vchip">Mitch has feelings</span></div>
  <div class="vabs vcenter vd" style="top:112px;font-weight:800;font-size:66px;line-height:1;color:var(--ink);animation:vrise .45s var(--back) 16.05s both">Got moods.</div>
  <div id="moods" class="vabs" style="left:26px;right:26px;top:228px;display:grid;grid-template-columns:1fr 1fr;gap:16px"></div>
  <div class="vabs vcenter" style="top:866px;font:700 19px Inter;color:#6E6D78;animation:vrise .45s var(--back) 19.25s both">Never sad. Never guilt-trips you.</div>
</div>

<!-- 20–22 END -->
<div class="vscene" data-show="20-23" style="background:var(--ink)">
  <div style="position:absolute;left:-60px;top:200px;width:660px;height:660px;border-radius:50%;background:radial-gradient(circle,rgba(200,242,58,.16),transparent 62%)"></div>
  <div class="vabs vcenter vd" style="top:90px;font-weight:800;font-size:76px;line-height:.95;color:#fff;animation:vslam .36s var(--out) 20s both">Which one's<br><span style="color:var(--lime)">yours?</span></div>
  <div id="endGrid" class="vabs" style="left:20px;right:20px;top:300px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px 0"></div>
  <div class="vabs vcenter vd" style="top:610px;font-weight:800;font-size:120px;line-height:1;color:#fff;animation:vslam .36s var(--out) 20.6s both">swot<span style="color:var(--lime)">.</span></div>
  <div class="vabs vcenter" style="top:760px;animation:vrise .45s var(--back) 20.85s both"><span class="vchip" style="background:var(--lime);color:var(--ink);font-size:16px;padding:12px 18px">Free GCSE revision · Coming soon</span></div>
</div>

</div>
<script src="mitch.js"></script>
<script src="engine.js"></script>
<script>
const $ = s => document.querySelector(s);
$('#heroMitch').innerHTML = mitch({eyes:'half',mouth:'smirk',acc:['headphones']});

const st = $('#stage');
VARIANTS.forEach((v, i) => {
  const t = 6 + i;
  const s = document.createElement('div');
  s.className = 'vscene';
  s.dataset.show = `${t}-${t + 1}`;
  s.style.background = v.bg;
  s.innerHTML = `
    <div style="position:absolute;inset:0;animation:vzoom .01s linear ${t}s both;"></div>
    <div class="vabs vcenter vd" style="top:150px;font-weight:800;font-size:380px;line-height:1;color:rgba(21,21,28,.06);letter-spacing:-.06em">${String(i + 1).padStart(2, '0')}</div>
    <div class="vabs vcenter" style="top:84px;animation:vrise .3s var(--back) ${t}s both"><span class="vchip">${String(i + 1).padStart(2, '0')} / 10</span></div>
    <div class="vabs" style="left:40px;top:180px;width:460px;transform-origin:50% 85%;--rot0:${i % 2 ? 10 : -10}deg;animation:vpop .42s var(--back) ${t}s both">
      <div style="animation:vfloat .5s ease-in-out ${t + 0.42}s infinite">${mitch(v)}</div>
    </div>
    <div class="vabs vcenter vd" style="top:610px;font-weight:800;font-size:${v.name.length > 13 ? 54 : 66}px;line-height:1;color:var(--ink);animation:vslam .3s var(--out) ${t + 0.1}s both">${v.name}</div>
    <div class="vabs" style="left:50px;right:50px;top:${v.name.length > 13 ? 690 : 700}px;text-align:center;font:600 23px/1.3 Inter;color:#3c3b45;animation:vrise .35s var(--back) ${t + 0.22}s both">${v.line}</div>`;
  st.insertBefore(s, $('#variants'));
});

const MOODS = [
  {o:{eyes:'happy',mouth:'open',acc:['sparkle']}, n:'Buzzing', s:'Aced a quiz', t:16.25},
  {o:{eyes:'half',mouth:'smirk'}, n:'Unbothered', s:'Default setting', t:17},
  {o:{eyes:'open',mouth:'o',acc:['sweat']}, n:'Mild panic', s:'Exam in 7 days', t:18},
  {o:{eyes:'closed',mouth:'flat',acc:['zzz']}, n:'Napping', s:'Missed a day. No hard feelings.', t:19},
];
MOODS.forEach((m, i) => {
  const c = document.createElement('div');
  c.className = 'vmood';
  c.style.cssText = `--rot0:${i % 2 ? 8 : -8}deg;animation:vpop .42s var(--back) ${m.t}s both`;
  c.innerHTML = mitch(m.o) + `<b>${m.n}</b><small>${m.s}</small>`;
  $('#moods').appendChild(c);
});

VARIANTS.forEach((v, i) => {
  const d = document.createElement('div');
  d.style.cssText = `animation:vpop .4s var(--back) ${20.1 + i * 0.05}s both`;
  d.innerHTML = `<div style="animation:vbob ${1 + (i % 3) * 0.2}s ease-in-out ${20.5}s infinite">${mitch(v)}</div>`;
  $('#endGrid').appendChild(d);
});

burst(st, 270, 330, 2.42, 30, 300);
burst(st, 270, 450, 20.0, 34, 320);
flashes([2, 6, 16, 20]);
seek(0);
document.fonts.ready.then(() => { window.READY = true; });
</script>
</body></html>
