<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
/* Practise with Mavis: a practice video call a week before Christmas. A tear-off desk calendar and the real guide. Green. */
.cal { position:absolute; left:var(--m); top:350px; width:440px; }
.rings { position:absolute; left:60px; right:60px; top:-22px; display:flex; justify-content:space-between; z-index:2; }
.rings i { width:20px; height:44px; border-radius:10px; background:linear-gradient(90deg, #8b929e, #e9edf2 45%, #7d8490); display:block; box-shadow:0 4px 6px rgba(0,0,0,.3); }
.page { border-radius:20px; overflow:hidden; background:#fffdf8; color:var(--ink); box-shadow: 0 6px 0 #e8e2d4, 0 12px 0 #d9d1bf, 0 30px 50px rgba(0,30,10,.45); }
.page .mon { background:#1F5FBF; color:#fff; text-align:center; font-weight:800; font-size:34px; letter-spacing:4px; padding:30px 0 18px; }
.page .day { text-align:center; font-weight:800; font-size:200px; line-height:1; letter-spacing:-8px; padding-top:18px; }
.page .dow { text-align:center; font-size:30px; font-weight:600; color:#5a6478; margin-top:4px; }
.page .note { margin:26px 30px 32px; padding:18px 22px; border-radius:14px; background:#fff3c4; font-size:28px; line-height:1.3; transform:rotate(-1.5deg); box-shadow:0 4px 10px rgba(120,90,0,.18); }
.page .note b { font-weight:800; }
.tick { position:absolute; right:-24px; top:110px; width:96px; height:96px; }
</style></head><body>
<section id="post" class="f-green">
  <h1 class="m">Video call on Christmas Day? Practise this&nbsp;week.</h1>
  <div class="cal chk">
    <div class="rings"><i></i><i></i><i></i><i></i></div>
    <div class="page"><div class="mon">DECEMBER</div><div class="day">17</div><div class="dow">Thursday</div>
      <div class="note"><b>6pm:</b> practice video call with Sarah. Make the tea&nbsp;first!</div></div>
    <div class="btn tick" style="background:#19A35A; display:grid; place-items:center"><svg viewBox="0 0 24 24" width="52" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="position:relative; z-index:1"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  </div>
  <div class="phone chk" style="--w:380px; left:620px; top:330px"><div class="scr sb" data-time="18:00"><img src="img/screen-whatsapp-step3.png" alt=""><div class="glass"></div></div><div class="cam"></div></div>
  <div class="say chk" style="left:var(--m); top:960px; width:480px"><div class="tile" style="--s:84px"></div><div class="bub" style="font-size:26px; padding:18px 22px">I&rsquo;ll talk you through it, one step at a&nbsp;time.</div></div>
  <div class="sig"><div class="mark"><div class="tile"></div><div><b>Ask Mavis</b><span>Practise with Mavis, every Thursday</span></div></div><div class="keys"><i></i><i class="on"></i><i></i><i></i></div></div>
</section></body></html>
