<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap">
<style>
/* "Wrap up some help": Christmas post. The present is wrapped in the Mavis icon's own colours (yellow box, blue ribbon),
   the app rises out of it, and the tag is the icon itself. 1080 x 1350. */
:root { --yellow:#FFC845; --blue:#1F5FBF; --ink:#102A56; --m:80px; }
* { box-sizing:border-box; margin:0; }
body { background:#999; padding:20px; font-family:"Atkinson Hyperlegible Next", sans-serif; }
#xmas { width:1080px; height:1350px; position:relative; overflow:hidden; color:#fff;
  background: radial-gradient(70% 55% at 50% 62%, #1e4a9a 0%, #12306b 45%, #0a1c42 100%); }
.snow { position:absolute; inset:0; }
.halo { position:absolute; left:50%; top:700px; width:820px; height:820px; transform:translate(-50%,-50%); border-radius:50%;
  background: radial-gradient(circle, rgba(255,200,69,.42) 0%, rgba(255,200,69,.12) 40%, transparent 68%); }
h1 { position:absolute; left:40px; right:40px; top:90px; text-align:center; font-weight:800; font-size:72px; line-height:1.02; letter-spacing:-1.8px; }
h1 em { font-style:normal; color:var(--yellow); }

/* the phone, rising out of the box */
.phone { position:absolute; left:50%; top:330px; width:330px; height:676px; margin-left:-165px; border-radius:46px; background:#0d1830; padding:9px;
  box-shadow:0 0 0 2px rgba(255,255,255,.1), 0 30px 70px rgba(0,0,0,.5), 0 0 90px rgba(255,200,69,.35); transform:rotate(-4deg); }
.phone img { width:100%; height:100%; object-fit:cover; object-position:top; border-radius:38px; display:block; }

/* the open box */
.lid { position:absolute; left:120px; top:700px; width:340px; height:120px; border-radius:14px; transform:rotate(-20deg);
  background: linear-gradient(180deg, #ffd770 0%, var(--yellow) 55%, #e8ab22 100%); box-shadow:0 18px 30px rgba(0,0,0,.35); }
.lid::before { content:""; position:absolute; left:0; right:0; top:0; height:26px; border-radius:14px 14px 0 0; background:rgba(255,255,255,.28); }
.lid::after { content:""; position:absolute; left:50%; top:0; bottom:0; width:64px; margin-left:-32px; background:linear-gradient(90deg,#174c9c,var(--blue) 40%,#2b6fd6 60%,#174c9c); }
.box { position:absolute; left:50%; top:850px; width:600px; height:270px; margin-left:-300px; border-radius:0 0 20px 20px;
  background: linear-gradient(180deg, #f2b42d 0%, var(--yellow) 14%, #ffd26b 55%, #e9ab24 100%);
  box-shadow: 0 30px 60px rgba(0,0,0,.45), inset 0 14px 0 rgba(0,0,0,.12); }
.box::before { content:""; position:absolute; left:50%; top:0; bottom:0; width:84px; margin-left:-42px; background:linear-gradient(90deg,#174c9c,var(--blue) 40%,#2b6fd6 60%,#174c9c); }
.rim { position:absolute; left:50%; top:834px; width:632px; height:40px; margin-left:-316px; border-radius:12px;
  background: linear-gradient(180deg, #ffd770, #e9ab24); box-shadow:0 8px 18px rgba(0,0,0,.25); }
.rim::after { content:""; position:absolute; left:50%; top:0; bottom:0; width:84px; margin-left:-42px; background:linear-gradient(90deg,#174c9c,var(--blue) 40%,#2b6fd6 60%,#174c9c); }

/* the tag: the Mavis icon, big, tied on with curled ribbon from a knot on the box's ribbon */
.twine { position:absolute; inset:0; z-index:4; pointer-events:none; overflow:visible; }
.tie { position:absolute; left:540px; top:846px; width:120px; height:64px; margin-left:-60px; z-index:3; filter:drop-shadow(0 4px 4px rgba(0,0,0,.3)); }
.tie i { position:absolute; top:4px; width:58px; height:42px; border-radius:50%; border:11px solid #4f93f2; box-shadow: inset 0 0 0 2px #174c9c, 0 0 0 2px #174c9c; }
.tie i:first-child { left:-6px; transform:rotate(-18deg); } .tie i:nth-child(2) { right:-6px; transform:rotate(18deg); }
.tie b { position:absolute; left:50%; top:16px; width:30px; height:30px; margin-left:-15px; border:2px solid #174c9c; background:#4f93f2 !important; border-radius:8px; background:#174c9c; box-shadow: inset 0 3px 0 rgba(255,255,255,.2); }
.tag { position:absolute; left:700px; top:880px; width:270px; padding:20px 20px 22px; border-radius:30px; background:#fff; color:var(--ink); text-align:center;
  transform:rotate(7deg); box-shadow:0 24px 44px rgba(0,0,0,.45); }
.tag::before { content:""; position:absolute; left:50%; top:12px; width:18px; height:18px; margin-left:-9px; border-radius:50%; background:#0a1c42; box-shadow: inset 0 0 0 4px #c9d2e3; }
.tag img { width:132px; height:132px; border-radius:34px; margin-top:22px; box-shadow:0 8px 18px rgba(16,42,86,.25); }
.tag b { display:block; font-size:36px; font-weight:800; letter-spacing:-.6px; margin-top:12px; }
.tag span { display:block; font-size:21px; color:#4a5a78; margin-top:2px; }

.lid .bow { position:absolute; top:-58px; width:92px; height:66px; border-radius:50% 50% 45% 45%; border:16px solid var(--blue); background:transparent; z-index:2; }
.lid .bow.l { left:72px; transform:rotate(-24deg); } .lid .bow.r { left:176px; transform:rotate(24deg); }
.lid .knot { position:absolute; left:148px; top:-16px; width:44px; height:36px; border-radius:12px; background:#174c9c; z-index:3; box-shadow: inset 0 3px 0 rgba(255,255,255,.2); }
.drift { position:absolute; left:50%; top:1060px; width:1000px; height:180px; margin-left:-500px; border-radius:50%;
  background: radial-gradient(60% 60% at 50% 40%, #ffffff 0%, #e6eefb 55%, rgba(230,238,251,0) 72%); }
.foot { position:absolute; left:var(--m); right:var(--m); top:1228px; text-align:center; font-size:30px; line-height:1.3; color:#dbe4f5; }
.foot b { color:#fff; font-weight:800; }
</style></head><body>
<section id="xmas">
  <svg class="snow" viewBox="0 0 1080 1350" aria-hidden="true" fill="#fff">
    <g opacity=".75"><circle cx="90" cy="380" r="5"/><circle cx="180" cy="520" r="3"/><circle cx="60" cy="700" r="4"/><circle cx="210" cy="880" r="3"/><circle cx="980" cy="420" r="5"/><circle cx="900" cy="560" r="3"/><circle cx="1010" cy="720" r="4"/><circle cx="860" cy="800" r="3"/><circle cx="140" cy="1080" r="4"/><circle cx="40" cy="1220" r="3"/><circle cx="1040" cy="1150" r="3"/><circle cx="300" cy="360" r="3"/><circle cx="790" cy="370" r="3"/></g>
    <g opacity=".35"><circle cx="250" cy="640" r="2"/><circle cx="830" cy="660" r="2"/><circle cx="120" cy="960" r="2"/><circle cx="960" cy="980" r="2"/><circle cx="350" cy="470" r="2"/><circle cx="720" cy="500" r="2"/></g>
    <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7" fill="none">
      <g transform="translate(150 300)"><path d="M0-22V22M-19-11 19 11M-19 11 19-11"/></g>
      <g transform="translate(940 300)"><path d="M0-18V18M-16-9 16 9M-16 9 16-9"/></g>
      <g transform="translate(110 840)"><path d="M0-14V14M-12-7 12 7M-12 7 12-7"/></g>
      <g transform="translate(990 860)"><path d="M0-16V16M-14-8 14 8M-14 8 14-8"/></g>
    </g>
    <!-- sparkles over the open box -->
    <g fill="#FFC845"><path d="M370 430 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6z"/><path d="M736 470 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z"/><path d="M330 660 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z"/><path d="M770 700 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z"/></g>
  </svg>
  <div class="halo"></div>
  <h1>New phone for Christmas?<br><em>Wrap up some help with&nbsp;it.</em></h1>
  <div class="drift"></div>
  <div class="lid"><i class="bow l"></i><i class="bow r"></i><i class="knot"></i></div>
  <div class="phone"><img src="home.jpg" alt=""></div>
  <div class="rim"></div>
  <div class="box"></div>
  <div class="tag"><img src="logo.png" alt=""><b>Ask Mavis</b><span>Help, one step at a time</span></div>
  <div class="tie"><i></i><i></i><b></b></div>
  <svg class="twine" viewBox="0 0 1080 1350" aria-hidden="true"><path id="tw-shadow" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="7" stroke-linecap="round"/><path id="tw" fill="none" stroke="#2b6fd6" stroke-width="5" stroke-linecap="round"/><path id="tw-hi" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.6" stroke-linecap="round"/></svg>
  <p class="foot"><b>Free tech help app for older people.</b> Coming soon to Android.</p>
</section>
<script>addEventListener("load",()=>{
  const sec=document.querySelector("#xmas").getBoundingClientRect(), hole=document.querySelector(".tag").getBoundingClientRect();
  // the tag is turned 7deg: its hole sits a little right of the box's centre line
  const hx=hole.left+hole.width/2-sec.left+14, hy=hole.top-sec.top+34;
  const x0=548, y0=878;
  // a loose ribbon: out of the knot, a curl, a soft sag, then up and through the hole
  const d=`M${x0} ${y0}
    C ${x0+30} ${y0+40}, ${x0+70} ${y0+46}, ${x0+66} ${y0+16}
    C ${x0+62} ${y0-10}, ${x0+34} ${y0+6}, ${x0+52} ${y0+34}
    C ${x0+74} ${y0+72}, ${hx-150} ${hy+40}, ${hx-60} ${hy-2}
    C ${hx-36} ${hy-12}, ${hx-12} ${hy-10}, ${hx} ${hy}`;
  for (const id of ["tw-shadow","tw","tw-hi"]) document.getElementById(id).setAttribute("d", d);
  document.getElementById("tw-shadow").setAttribute("transform","translate(2 5)");
});</script>
</body></html>
