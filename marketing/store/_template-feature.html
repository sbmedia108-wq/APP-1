<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0}
body{width:1024px;height:500px;background:#0B1726;color:#fff;font-family:Barlow,sans-serif;position:relative;overflow:hidden}
.tape{position:absolute;left:0;right:0;bottom:0;height:20px;background:repeating-linear-gradient(-45deg,#FFB020 0 20px,#0B1726 20px 40px)}
.l{position:absolute;left:60px;top:66px;width:470px}
.brand{display:flex;align-items:center;gap:14px;font-family:Archivo;font-weight:900;font-stretch:85%;font-size:44px}
.brand img{width:76px;margin:-10px -6px -10px -10px}
h1{font-family:Archivo;font-stretch:76%;font-weight:900;text-transform:uppercase;font-size:58px;line-height:.95;margin:24px 0 0}
h1 em{font-style:normal;color:#FFB020}
p{font-size:22px;color:rgba(255,255,255,.7);margin:18px 0 0}
.ph{position:absolute;right:40px;top:40px;width:250px;border-radius:38px;background:#05090F;padding:9px;transform:rotate(4deg);box-shadow:0 30px 70px rgba(0,0,0,.5)}
.ph img{width:100%;display:block;border-radius:30px}
.ph2{right:250px;top:110px;transform:rotate(-6deg);width:210px;opacity:.85}
</style></head><body>
<div class="l"><div class="brand"><img src="graft-mark.svg">Graft</div>
<h1>Quote it on the drive.<br><em>Home for tea.</em></h1><p>Talk the job. Graft prices it. WhatsApp sends it.</p></div>
<div class="ph ph2"><img src="03-talk-memory.png"></div><div class="ph"><img src="05-quote-total.png"></div>
<div class="tape"></div></body></html>
