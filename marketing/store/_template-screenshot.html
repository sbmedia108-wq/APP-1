<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1080px;height:1920px;background:#0B1726;font-family:Barlow,sans-serif;position:relative;overflow:hidden;color:#fff}
.tape{position:absolute;left:0;right:0;bottom:0;height:46px;background:repeating-linear-gradient(-45deg,#FFB020 0 46px,#0B1726 46px 92px)}
.cap{position:absolute;top:120px;left:90px;right:90px}
.eyebrow{font-size:30px;letter-spacing:.14em;text-transform:uppercase;color:#FFB020;font-weight:600}
h1{font-family:Archivo,sans-serif;font-stretch:76%;font-weight:900;text-transform:uppercase;font-size:118px;line-height:.95;margin:18px 0 0;letter-spacing:-.01em}
h1 em{font-style:normal;color:#FFB020}
.sub{font-size:38px;color:rgba(255,255,255,.7);margin-top:26px;line-height:1.3}
.phone{position:absolute;left:50%;top:700px;transform:translateX(-50%);width:640px;border-radius:84px;background:#05090F;padding:20px;box-shadow:0 60px 140px rgba(0,0,0,.55),inset 0 0 0 3px rgba(255,255,255,.12)}
.phone img{display:block;width:100%;border-radius:66px}
.logo{position:absolute;top:44px;right:70px;width:96px;opacity:.95}
</style></head><body>
<img class="logo" src="graft-mark.svg">
<div class="cap"><div class="eyebrow">EYEBROW</div><h1>HEADLINE</h1><div class="sub">SUB</div></div>
<div class="phone"><img src="SCREEN"></div>
<div class="tape"></div>
</body></html>
