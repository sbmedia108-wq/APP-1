.f13 .me { position:absolute; left:50%; top:560px; height:930px; transform:translateX(-50%); z-index:4; filter:saturate(.85) contrast(1.08) drop-shadow(0 0 40px rgba(224,22,31,.45)); }

.f13 .fog { position:absolute; left:0; right:0; bottom:150px; height:260px; z-index:5; background:linear-gradient(transparent,rgba(170,185,215,.34)); }
.f13 .bar { position:absolute; left:0; right:0; bottom:0; height:176px; background:#050505; z-index:8; border-top:26px solid transparent;

.f13 .bar i { display:block; font:700 27px Oswald; font-style:normal; letter-spacing:5px; text-transform:uppercase; color:#fff; }
