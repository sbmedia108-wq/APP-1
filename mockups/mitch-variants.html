<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ten Mitches</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F4EF;--ink:#15151C;--muted:#6E6D78;--line:#E6E2D9;--lime:#C8F23A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#DCD8CE;font-family:Inter,sans-serif;color:var(--ink);padding:40px;-webkit-font-smoothing:antialiased}
h1,h2,b,.d{font-family:'Bricolage Grotesque';letter-spacing:-.03em}
#sheet{width:1800px;background:var(--paper);border-radius:36px;padding:56px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:34px}
.label{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.card{border-radius:26px;padding:16px 18px 20px;border:1px solid rgba(21,21,28,.08);display:flex;flex-direction:column}
.card svg{width:100%;height:220px}
.num{font-size:12px;font-weight:700;color:rgba(21,21,28,.45)}
.card b{font-size:24px;display:block;margin-top:2px}
.card p{font-size:13.5px;line-height:1.4;color:#3c3b45;margin-top:4px;min-height:57px}
.meter{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:rgba(21,21,28,.55);margin-top:12px;text-transform:uppercase;letter-spacing:.06em}
.meter .track{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#FF8FB1,#8B6CFF 50%,#15151C);position:relative}
.meter .knob{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--ink);transform:translate(-50%,-50%)}
</style>
</head>
<body>
<div id="sheet">
  <div class="top">
    <div>
      <div class="label">Character exploration · 10 variants</div>
      <h1 style="font-size:64px;font-weight:800;line-height:1;margin-top:6px">Ten Mitches. One donny.</h1>
    </div>
    <p style="font-size:16px;color:var(--muted);max-width:430px;text-align:right;line-height:1.45">Same bean, different energy. Each one could be a starter skin, an unlock, or a seasonal drop.</p>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
const INK='#15151C';
let uid=0;
function mitch(o){
  const F=o.fill, D=o.deep, id='c'+(uid++);
  const E={L:125,R:175,Y:126};
  const eye=(x,t)=>{
    const Y=E.Y;
    switch(t){
      case 'happy': return `<path d="M${x-10} ${Y+4} q10 -14 20 0" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
      case 'closed': return `<path d="M${x-10} ${Y} q10 10 20 0" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
      case 'half': return `<ellipse cx="${x}" cy="${Y+2}" rx="10" ry="12" fill="${INK}"/><rect x="${x-14}" y="${Y-14}" width="28" height="12" fill="${F}"/><path d="M${x-12} ${Y-2} h24" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><circle cx="${x+3}" cy="${Y+5}" r="3" fill="#fff"/>`;
      case 'star': return `<path d="M${x} ${Y-14} l4.5 9 10 1.2 -7.5 6.8 2.2 10 -9.2 -5.2 -9.2 5.2 2.2 -10 -7.5 -6.8 10 -1.2z" fill="#FFD84A" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>`;
      case 'angry': return `<ellipse cx="${x}" cy="${Y+2}" rx="10" ry="12" fill="${INK}"/><circle cx="${x+3}" cy="${Y-2}" r="3.5" fill="#fff"/>`;
      case 'none': return '';
      default: return `<ellipse cx="${x}" cy="${Y}" rx="10" ry="13" fill="${INK}"/><circle cx="${x+3}" cy="${Y-5}" r="3.5" fill="#fff"/>`;
    }
  };
  let eyes = o.eyes==='wink' ? eye(E.L,'open')+eye(E.R,'happy') : eye(E.L,o.eyes)+eye(E.R,o.eyes);
  if(o.eyes==='angry') eyes += `<path d="M110 106 L138 113 M190 106 L162 113" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>`;
  const M={
    smile:`<path d="M138 147 q12 12 24 0" stroke="${INK}" stroke-width="5.5" fill="none" stroke-linecap="round"/>`,
    smirk:`<path d="M139 150 q12 6 24 -4" stroke="${INK}" stroke-width="5.5" fill="none" stroke-linecap="round"/>`,
    flat:`<path d="M141 151 h18" stroke="${INK}" stroke-width="5.5" stroke-linecap="round"/>`,
    open:`<path d="M138 146 h24 q-2 16 -12 16 q-10 0 -12 -16z" fill="${INK}"/><path d="M144 156 q6 4 12 0" stroke="#F2547D" stroke-width="5" fill="none" stroke-linecap="round"/>`,
    grin:`<path d="M132 145 h36 q-2 20 -18 20 q-16 0 -18 -20z" fill="${INK}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><rect x="136" y="146" width="28" height="6" rx="2" fill="#fff"/>`,
    tongue:`<path d="M139 148 q12 6 24 -2" stroke="${INK}" stroke-width="5.5" fill="none" stroke-linecap="round"/><path d="M152 151 q0 12 7 12 q7 0 6 -14" fill="#F2547D" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`,
    cat:`<path d="M136 148 q7 8 14 0 q7 8 14 0" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
  };
  const cheeks = o.noCheeks?'':`<ellipse cx="104" cy="149" rx="11" ry="6.5" fill="${o.cheek||'#F2547D'}" opacity="${o.cheekOp||.38}"/><ellipse cx="196" cy="149" rx="11" ry="6.5" fill="${o.cheek||'#F2547D'}" opacity="${o.cheekOp||.38}"/>`;
  const A={
    headphones:`<path d="M58 128 C52 30 248 30 242 128" stroke="${INK}" stroke-width="9" fill="none" stroke-linecap="round"/><rect x="40" y="108" width="26" height="44" rx="11" fill="${o.acc1||'#8B6CFF'}" stroke="${INK}" stroke-width="5"/><rect x="234" y="108" width="26" height="44" rx="11" fill="${o.acc1||'#8B6CFF'}" stroke="${INK}" stroke-width="5"/>`,
    mic:`<path d="M52 148 q4 30 62 16" stroke="${INK}" stroke-width="5.5" fill="none" stroke-linecap="round"/><rect x="108" y="156" width="16" height="13" rx="6" fill="${INK}"/>`,
    shades:`<path d="M94 116 h112" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><path d="M99 114 h43 v8 q0 22 -21.5 22 q-21.5 0 -21.5 -22z" fill="${INK}"/><path d="M158 114 h43 v8 q0 22 -21.5 22 q-21.5 0 -21.5 -22z" fill="${INK}"/><path d="M107 121 l9 -0 M166 121 l9 0" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8"/>`,
    chain:`<path d="M96 174 q54 34 108 0" stroke="${INK}" stroke-width="11" fill="none" stroke-linecap="round"/><path d="M96 174 q54 34 108 0" stroke="#FFC93C" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="7 4"/><circle cx="150" cy="193" r="13" fill="#FFC93C" stroke="${INK}" stroke-width="4.5"/><text x="150" y="199" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="16" fill="${INK}">M</text>`,
    flower:`<g transform="translate(214 82)">${[0,72,144,216,288].map(r=>`<ellipse cx="0" cy="-13" rx="9" ry="12" fill="#fff" stroke="${INK}" stroke-width="4" transform="rotate(${r})"/>`).join('')}<circle r="8" fill="#FFC93C" stroke="${INK}" stroke-width="4"/></g>`,
    snapback:`<ellipse cx="78" cy="86" rx="32" ry="9" fill="${o.acc2||INK}" stroke="${INK}" stroke-width="5" transform="rotate(-14 78 86)"/><path d="M88 90 q4 -62 62 -62 q58 0 62 62 z" fill="${o.acc1||'#2F6BFF'}" stroke="${INK}" stroke-width="5.5" stroke-linejoin="round"/><path d="M150 30 v58" stroke="${INK}" stroke-width="3.5" opacity=".35"/><rect x="134" y="76" width="32" height="12" rx="6" fill="${o.fill}" stroke="${INK}" stroke-width="4"/><circle cx="150" cy="28" r="6" fill="${INK}"/>`,
    flame:`<path d="M150 6 c12 20 34 28 34 50 c0 16 -15 24 -34 24 c-19 0 -34 -8 -34 -24 c0 -12 8 -20 13 -28 c2 10 8 15 13 15 c-6 -14 0 -26 8 -37z" fill="#FF5A36" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><path d="M150 40 c6 10 16 14 16 24 c0 8 -7 12 -16 12 c-9 0 -16 -4 -16 -12 c0 -8 8 -12 16 -24z" fill="#FFD84A"/>`,
    stars:`${[[86,100,1],[214,96,.8],[204,178,.7],[94,176,.6],[150,86,.55]].map(([x,y,s])=>`<path d="M${x} ${y-8*s} l${2.4*s} ${5.6*s} ${5.6*s} ${2.4*s} -${5.6*s} ${2.4*s} -${2.4*s} ${5.6*s} -${2.4*s} -${5.6*s} -${5.6*s} -${2.4*s} ${5.6*s} -${2.4*s}z" fill="#fff" opacity=".9"/>`).join('')}<circle cx="232" cy="140" r="2.5" fill="#fff"/><circle cx="70" cy="138" r="2" fill="#fff"/><circle cx="182" cy="92" r="2" fill="#fff" opacity=".8"/>`,
    ring:`<ellipse cx="150" cy="188" rx="128" ry="16" fill="none" stroke="#FFD84A" stroke-width="6" transform="rotate(-5 150 188)" stroke-dasharray="160 80 400" />`,
    headband:`<g clip-path="url(#${id})"><rect x="40" y="86" width="220" height="18" fill="${o.acc1||'#F2405A'}"/><path d="M40 86 h220 M40 104 h220" stroke="${INK}" stroke-width="4"/><path d="M40 95 h220" stroke="#fff" stroke-width="3" opacity=".7"/></g>`,
    ball:`<g transform="translate(262 192)"><circle r="22" fill="#fff" stroke="${INK}" stroke-width="5"/><path d="M0 -8 l7.6 5.5 -2.9 9 h-9.4 l-2.9 -9z" fill="${INK}"/><path d="M0 -8 v-13 M7.6 -2.5 l12 -4 M4.7 6.5 l7.5 11 M-4.7 6.5 l-7.5 11 M-7.6 -2.5 l-12 -4" stroke="${INK}" stroke-width="3"/></g>`,
    visor:`<rect x="88" y="106" width="124" height="40" rx="20" fill="${INK}"/><rect x="108" y="122" width="26" height="8" rx="4" fill="#C8F23A"/><rect x="166" y="122" width="26" height="8" rx="4" fill="#C8F23A"/><rect x="108" y="122" width="26" height="8" rx="4" fill="#C8F23A" opacity=".35" transform="translate(0 0) scale(1)" filter="url(#glow${id})"/><path d="M98 114 q10 -4 22 -4" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".35"/>`,
    antenna:`<path d="M150 70 v-30" stroke="${INK}" stroke-width="5"/><circle cx="150" cy="34" r="9" fill="#C8F23A" stroke="${INK}" stroke-width="4.5"/>`,
    bucket:`<ellipse cx="150" cy="86" rx="86" ry="16" fill="${o.acc1||'#FFF6E0'}" stroke="${INK}" stroke-width="5.5"/><path d="M98 84 q2 -54 52 -54 q50 0 52 54 q-52 10 -104 0z" fill="${o.acc1||'#FFF6E0'}" stroke="${INK}" stroke-width="5.5" stroke-linejoin="round"/><path d="M99 72 q51 9 102 0" stroke="${o.acc2||'#FF7A45'}" stroke-width="8" fill="none"/>`,
    bow:`<g transform="translate(150 66)"><path d="M0 0 l-30 -16 q-8 16 0 32z" fill="${o.acc1||'#FF5C8A'}" stroke="${INK}" stroke-width="4.5" stroke-linejoin="round"/><path d="M0 0 l30 -16 q8 16 0 32z" fill="${o.acc1||'#FF5C8A'}" stroke="${INK}" stroke-width="4.5" stroke-linejoin="round"/><circle r="8" fill="${o.acc1||'#FF5C8A'}" stroke="${INK}" stroke-width="4.5"/></g>`,
    sparkle:`<path d="M248 58 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z" fill="#FFD84A" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/><path d="M50 80 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z" fill="#FFD84A" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`,
    frost:`<path d="M68 72 l6 6 M74 72 l-6 6 M71 70 v10 M66 75 h10" stroke="#fff" stroke-width="3" stroke-linecap="round" transform="translate(-14 -10)"/><path d="M68 72 l6 6 M74 72 l-6 6 M71 70 v10 M66 75 h10" stroke="#fff" stroke-width="3" stroke-linecap="round" transform="translate(178 104)"/>`,
    cardigan:`<g clip-path="url(#${id})"><path d="M40 160 h220 v60 h-220z" fill="${o.acc1||'#C98B5A'}"/><path d="M40 160 h220" stroke="${INK}" stroke-width="4.5"/><path d="M150 160 v50" stroke="${INK}" stroke-width="4"/><circle cx="140" cy="176" r="3.5" fill="${INK}"/><circle cx="140" cy="191" r="3.5" fill="${INK}"/></g>`,
    tea:`<g transform="translate(262 180)"><path d="M-16 -16 h28 v22 q0 12 -14 12 q-14 0 -14 -12z" fill="#fff" stroke="${INK}" stroke-width="4.5" stroke-linejoin="round"/><path d="M12 -10 q12 0 12 9 q0 8 -12 8" fill="none" stroke="${INK}" stroke-width="4.5"/><path d="M-8 -26 q4 -6 0 -12 M2 -26 q4 -6 0 -12" stroke="${INK}" stroke-width="3" stroke-linecap="round" opacity=".45" fill="none"/></g>`
  };
  const pre=(o.pre||[]).map(a=>A[a]).join('');
  const post=(o.acc||[]).map(a=>A[a]).join('');
  const cristae=`<rect x="66" y="84" width="168" height="102" rx="51" fill="none" stroke="${D}" stroke-width="5"/>
    <path d="M90 86 v26 M210 86 v26 M104 184 v-22 M196 184 v-22 M150 186 v-14" stroke="${D}" stroke-width="5" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 300 236" xmlns="http://www.w3.org/2000/svg">
    <defs><clipPath id="${id}"><rect x="52" y="70" width="196" height="130" rx="65"/></clipPath>
    <filter id="glow${id}"><feGaussianBlur stdDeviation="3"/></filter></defs>
    ${pre}
    <ellipse cx="150" cy="218" rx="80" ry="8" fill="${INK}" opacity=".1"/>
    <ellipse cx="118" cy="204" rx="16" ry="9" fill="${INK}"/><ellipse cx="182" cy="204" rx="16" ry="9" fill="${INK}"/>
    <path d="M56 140 q-18 4 -20 20" stroke="${INK}" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M244 140 q18 4 20 20" stroke="${INK}" stroke-width="7" fill="none" stroke-linecap="round"/>
    <rect x="52" y="70" width="196" height="130" rx="65" fill="${F}"/>
    <g clip-path="url(#${id})">${o.belly?`<ellipse cx="150" cy="210" rx="90" ry="40" fill="${o.belly}"/>`:''}${cristae}</g>
    <rect x="52" y="70" width="196" height="130" rx="65" fill="none" stroke="${INK}" stroke-width="6.5"/>
    <ellipse cx="96" cy="94" rx="18" ry="8" fill="#fff" opacity=".5" transform="rotate(-20 96 94)"/>
    ${cheeks}${eyes}${M[o.mouth]}${post}</svg>`;
}

const V=[
 {name:'OG Mitch',line:'The original. Unbothered since day one. Headphones never come off.',
  fill:'#C8F23A',deep:'#9CC41A',eyes:'half',mouth:'smirk',acc:['headphones'],bg:'#EEF7CF',cute:45},
 {name:'Donny Mitch',line:'Shades indoors. Gold chain. Somehow gets away with it every time.',
  fill:'#9B82FF',deep:'#7A5CF0',eyes:'none',mouth:'smirk',acc:['shades','chain'],bg:'#E9E3FF',cute:82,noCheeks:true},
 {name:'Blossom Mitch',line:'Soft, sweet, flower in her hair. Will still destroy you in Biology.',
  fill:'#FFB8CB',deep:'#F28DAA',eyes:'happy',mouth:'cat',acc:['flower'],bg:'#FFE6EE',cute:10,cheek:'#E0406E',cheekOp:.45},
 {name:'Frosty Mitch',line:'Ice cold under exam pressure. Cap backwards, obviously.',
  fill:'#A9DDFF',deep:'#7CC0EE',eyes:'wink',mouth:'grin',acc:['snapback','frost'],acc1:'#2F5BFF',acc2:'#15151C',bg:'#E2F2FF',cute:68},
 {name:'Lava Mitch',line:'Exam season? Beast mode. Literally on fire. Do not touch.',
  fill:'#FF9A57',deep:'#EB7034',eyes:'angry',mouth:'grin',acc:['flame'],bg:'#FFE5D4',cute:78,cheek:'#D8342A',cheekOp:.3},
 {name:'Cosmic Mitch',line:'Has seen the whole universe. Still can\'t do simultaneous equations.',
  fill:'#7479F0',deep:'#5A5FD8',eyes:'star',mouth:'open',acc:['stars','ring'],bg:'#E3E4FF',cute:38,cheek:'#FF8FB1',cheekOp:.5},
 {name:'Gamer Mitch',line:'Ranked #1 in quadratics. Mic always on. Says "GG" after every quiz.',
  fill:'#4FDCC6',deep:'#2DB8A2',eyes:'half',mouth:'tongue',acc:['headphones','mic'],acc1:'#15151C',bg:'#D9F7F1',cute:72},
 {name:'Five-a-side Mitch',line:'Revises at half-time. Celebrates every right answer like a worldie.',
  fill:'#FFFFFF',deep:'#E2E2EA',eyes:'open',mouth:'open',acc:['headband','ball'],acc1:'#F2405A',bg:'#ECEAF0',cute:64},
 {name:'Glitch Mitch',line:'Downloaded the entire spec. Running on 4% battery. Beep.',
  fill:'#C9CFDB',deep:'#A4ACBD',eyes:'none',mouth:'flat',acc:['visor','antenna'],bg:'#E6E9EF',cute:90,noCheeks:true},
 {name:'Grandad Mitch',line:'Cardigan. Cup of tea. "In my day we had textbooks." Secretly the wisest.',
  fill:'#FFD84A',deep:'#E8B91E',eyes:'closed',mouth:'smile',acc:['cardigan','tea'],acc1:'#B97A4E',bg:'#FFF3C8',cute:30},
];
document.getElementById('grid').innerHTML = V.map((v,i)=>`
 <div class="card" style="background:${v.bg}">
   <span class="num">${String(i+1).padStart(2,'0')}</span>
   ${mitch(v)}
   <b>${v.name}</b><p>${v.line}</p>
   <div class="meter"><span>Cute</span><div class="track"><div class="knob" style="left:${v.cute}%"></div></div><span>Cool</span></div>
 </div>`).join('');
</script>
</body>
</html>
